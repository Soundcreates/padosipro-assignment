services:
  db:
    image: postgres:17
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: a_secure_dev_password
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - padosipro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padosipro_backend
    restart: always
    ports:
      - "3003:3003"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://dev_user:a_secure_dev_password@db:5432/dev_db
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: a_secure_dev_password
      POSTGRES_DB: dev_db
      JWT_SECRET: dev_jwt_secret_change_me
      JWT_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: 10
      CORS_ORIGINS: "*"
      OTP_LENGTH: 6
      OTP_EXPIRES_IN_MINUTES: 10
      REDIS_URL: redis://redis:6379
      MAILPIT_HOST: mailpit
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    networks:
      - padosipro_net

  redis:
    image: redis:7-alpine
    container_name: padosipro_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - padosipro_net

  mailpit:
    image: axllent/mailpit:latest
    container_name: padosipro_mailpit
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - padosipro_net

volumes:
  postgres_data:

networks:
  padosipro_net:
    driver: bridge
