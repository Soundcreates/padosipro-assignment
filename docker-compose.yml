services:
  db:
    image: postgres:17
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: a_secure_dev_password
      POSTGRES_DB: dev_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - padosipro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d dev_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padosipro_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: a_secure_dev_password
      POSTGRES_DB: dev_db
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - padosipro_net

volumes:
  postgres_data:

networks:
  padosipro_net:
    driver: bridge
